# MCP preparatory configuration
# Mission: Future SSE server (not yet deployed)
# Status: Préparatoire - does not claim MCP exists
# This config documents what will be needed when MCP exists

# SSE stream proxy (preparatory)
stream {
    sse_proxy localhost:9000 {
        protocol tcp;
        proxy_timeout 30s;
        # Critical for SSE: disable buffering
        proxy_buffering off;
        proxy_read_timeout 30s;
        # When MCP exists:
        # - proxy_pass http://mcp-server:8080/sse
        # - This config prepares the nginx layer for SSE events
        # - NOT ACTIVE: no MCP server deployed
    }
}

