# OKA reverse proxy configuration
# Mission: Support UCit - OKA platform access
# Source: OKA provides ready-to-use files oka.nginx.conf and oka.nginx_ssl.conf

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name oka.support.universite-cite.fr;
    return 301 https://$host$request_uri;
}

# OKA HTTPS reverse proxy
server {
    listen 443 ssl http2;
    server_name oka.support.universite-cite.fr;

    ssl_certificate /etc/ssl/certs/oka.crt;
    ssl_certificate_key /etc/ssl/private/oka.key;

    # SSL settings from OKA documentation
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Proxy to OKA backend
    location / {
        proxy_pass http://oka-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for OKA SSL
        proxy_ssl on;
        proxy_ssl_certificate /etc/ssl/certs/oka.crt;
        proxy_ssl_certificate_key /etc/ssl/private/oka.key;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://oka-backend:8080/health;
    }
}
