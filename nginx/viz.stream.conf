# Visualization reverse proxy configuration
# Mission: Remote 2D/3D visualization (TICKET-008)
# Module: stream - for non-HTTP protocols (VNC, DCV, etc.)
# Status: Active

# Stream proxy for VNC
stream {
    vnc_proxy localhost:5900 {
        protocol tcp;
        # Critical: keepalive for long-lived connections
        proxy_timeout 1h;
        proxy_buffering off;
        # Link to mission: Remote visualization portal
        # Enables access to TurboVNC noVNC console via https://oka.support.universite-cite.fr/vnc
    }

    # Stream proxy for DCV
    dcv_proxy localhost:8080 {
        protocol tcp;
        proxy_timeout 1h;
        proxy_buffering off;
        # Link to mission: Windows remote visualization
    }
}

# HTTP fallback for visualization status
server {
    listen 443 ssl http2;
    server_name viz.support.universite-cite.fr;

    ssl_certificate /etc/ssl/certs/viz.crt;
    ssl_certificate_key /etc/ssl/private/viz.key;

    location / {
        proxy_pass http://viz-backend:8080;
    }
}
