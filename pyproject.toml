[project]
name = "oka-support-desk"
version = "0.1.0"
description = "POC support UCit pour la plateforme OKA"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.0,<7.0",
]

# pydantic is only imported by the rule skeletons emitted as text by
# tools/rule_generator.py; it is not a runtime dependency of this POC.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["applications", "lib"]
