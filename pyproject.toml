[project]
name = "oka-support-desk"
version = "0.1.0"
description = "POC support UCit pour la plateforme OKA"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.0,<7.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
