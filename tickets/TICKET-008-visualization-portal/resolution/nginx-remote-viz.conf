# Exemple de reverse proxy Nginx pour noVNC/TurboVNC.
# L'ALB termine le TLS public et forwarde vers ce serveur sur le port 8080.
# Adapter server_name, upstream et chemins avant tout déploiement.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream novnc_backend {
    server 127.0.0.1:6080;
    keepalive 16;
}

server {
    listen 8080;
    server_name viz.example.org;

    client_max_body_size 20m;

    # Health check utilisé par le groupe cible ALB.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://novnc_backend;
        proxy_http_version 1.1;

        # Indispensable pour le WebSocket noVNC.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Sessions de visualisation longues : aligner avec le timeout ALB.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
